<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BOOL AI</title>
<style>:root{--bg:#0f1115;--card:#171a21;--bd:#2a2f3a;--tx:#eef0f4;--ac:#6ee7a8}@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--card:#fff;--bd:#d9dde5;--tx:#14171c;--ac:#0f9d58}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Arial,sans-serif;padding:20px;max-width:420px;margin-inline:auto}.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:40px}
input,button{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);font:inherit;margin-top:10px;background:transparent;color:inherit}button{background:var(--ac);color:#06210f;font-weight:700;border-color:var(--ac)}#m{margin-top:10px;min-height:1.2em}</style></head>
<body><div class="c"><h2 style="margin:0">BOOL AI · Password</h2><input id="p" type="password" minlength="8" placeholder="8+" autocomplete="new-password" dir="ltr"><button id="b">OK</button><div id="m"></div></div>
<script>
var t=new URLSearchParams(location.search).get("t")||"";
document.getElementById("b").onclick=function(){var m=document.getElementById("m");m.textContent="";
fetch("/api/set-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t,password:document.getElementById("p").value})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Error");location.href=location.origin+"/"})}).catch(function(e){m.textContent=e.message})};
</script></body></html>
