const WHY = {

    ['ייצור לפי מידה','לוחות, שולחנות, ברים, גופי תאורה וחלקים מיוחדים לפי צורכי הפרויקט.'],

    ['חיתוך לפי מידה','אריחים, לוחות, משטחים, מדרגות וחלקים מיוחדים לפי התוכנית.'],
    ['ליווי מקצועי','עוזרים לבחור פורמט, עובי וגימור שמתאימים לשימוש ולסגנון.'],
    ['הצעת מחיר מותאמת','מחיר למ"ר או לפי פרויקט — לפי מידות, כמות וגימור.'],
  ],
};
const APPS = {
  onyx: [
    ['🪵 שולחנות ופינות אוכל','שולחנות אוכל, שולחנות סלון ושולחנות צד — יוקרה וגימור מרהיב.','לוחות, חיתוך לפי מידה'],
    ['💡 קירות מוארים','קירות עם תאורת LED מאחור. השקיפות של האוניקס יוצרת אפקט אור דרמטי.','לוחות'],
    ['🍸 ברים ומשטחים','ברים במטבח, ברי אירוח ומשטחים דקורטיביים עם נוכחות חזקה.','לוחות, משטחים לפי מידה'],
    ['💧 כיורים ואמבטיות','כיורים, קירות אמבטיה ומקלחות — נגיעה של יוקרה.','לוחות, חיתוכים מיוחדים'],
    ['🔦 גופי תאורה','מנורות וגופי תאורה דקורטיביים — אור חם ועוטף.','חיתוך אישי'],
    ['🎨 אלמנטים דקורטיביים','קמינים, נישות, מדפים ופרטים אדריכליים.','לפי מידה'],
  ],
  marble: [
    ['🏠 רצפות','ריצוף לסלון, למבואה ולחללים מסחריים — עמיד ואלגנטי.','אריחים, פרקט, רצועות'],
    ['🧱 חיפוי קירות','קירות פנים וחוץ, חזיתות וקירות מבטא.','לוחות, אריחים'],
    ['🍳 מטבחים','משטחי עבודה, איים וחיפויים.','משטחים לפי מידה'],
    ['🛁 אמבטיות','קירות, משטחים, כיורים ומקלחות.','לוחות, חיתוכים מיוחדים'],
    ['🪜 מדרגות','מדרגות, פודסטים ומעקות.','חיתוך לפי מידה'],
    ['🏛️ אלמנטים דקורטיביים','עמודים, מעקות, אדני חלון ופרטים מיוחדים.','לפי מידה'],
  ],
};
const WA = 'https://wa.me/19093443250?text=';
const ALL = [...STONES.onyx.map(s => ({...s, type:'onyx'})), ...STONES.marble.map(s => ({...s, type:'marble'}))];
const app = document.getElementById('app');
let lbItems = [];

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs || {})){
    if(k === 'text') n.textContent = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for(const c of kids.flat(Infinity)) if(c !== null && c !== undefined && c !== false) n.append(c);
  return n;
}
const src = f => 'images/collection/' + f;
const mount = (...kids) => app.replaceChildren(...kids.flat(Infinity).filter(Boolean));

function card(s){
  return el('a', {class:'card', href:'#/' + s.id},
    el('div', {class:'ph'}, el('img', {src:src(s.imgs[0]), alt:s.name, loading:'lazy'})),
    el('div', {class:'t', text:s.name.toUpperCase()}),
    el('div', {class:'go', text:'לקטלוג המלא ←'}));
}

function renderCatalog(){
  document.title = 'קטלוג אוניקס ושיש | ROCCA רוקה';
  mount(
    el('div', {class:'crumbs'}, el('a', {href:'index.html', text:'דף הבית'}), ' › קטלוג'),
    el('h1', {text:'קטלוג אוניקס ושיש'}),
    el('p', {class:'lead', text:'הכירו את גווני האוניקס השקוף ואת סוגי השיש שלנו. כל סוג מוביל לדף מלא עם תמונות, מפרט טכני, יישומים ואפשרות לבקש הצעת מחיר.'}),
    el('div', {class:'note'}, el('strong', {text:'חשוב לדעת: '}), 'באוניקס לא בוחרים מדוגמה — בוחרים את הלוח עצמו. כל לוח יחיד במינו, ואין עוד אחד כמוהו.'),
    el('div', {class:'group', text:'אוניקס'}),
    el('div', {class:'cards'}, STONES.onyx.map(card)),
    el('div', {class:'group', text:'שיש'}),
    el('div', {class:'cards'}, STONES.marble.map(card)),
    el('div', {class:'ctabox', style:'margin-top:30px'},
      el('p', {text:'מחפשים גוון שלא מופיע כאן, או צריכים בלוקים שלמים לפרויקט גדול? דברו איתנו.'}),
      el('a', {class:'btn wa', target:'_blank', rel:'noopener', href:WA + encodeURIComponent('היי, אשמח לפרטים על הקטלוג של ROCCA'), text:'הצעת מחיר בוואטסאפ'})));
  lbItems = [];
  document.getElementById('waFloat').href = WA + encodeURIComponent('היי, ראיתי את הקטלוג של ROCCA ואשמח לפרטים');
}

function zoomBtn(file, caption, inner){
  const idx = lbItems.length;
  lbItems.push({src:src(file), caption});
  return el('button', {type:'button', 'aria-label':'הגדלה — ' + caption, onclick:() => openLb(idx)}, inner);
}

function renderStone(s){
  const isOnyx = s.type === 'onyx';
  lbItems = [];
  document.title = s.name + ' | ROCCA רוקה';
  const ask = isOnyx ? 'היי, אשמח לראות לוחות זמינים של ' + s.name : 'היי, אשמח להצעת מחיר על ' + s.name;
  document.getElementById('waFloat').href = WA + encodeURIComponent(ask);
  const specs = [
    ['שם החומר', s.name + ' (' + s.latin + ')'],
    ['מראה', s.look],
    ['צורות', s.forms || ONYX_SPECS.forms],
    ['גימורים', s.finish || ONYX_SPECS.finish],
    ['עוביים', s.thick || ONYX_SPECS.thick],
  ];
  if(s.extra) specs.push(['עמידות', s.extra]);
  specs.push(['שימושים מומלצים', (isOnyx ? ONYX_USES : MARBLE_USES).join(', ')]);
  specs.push(['סוג פרויקט', 'פרטי, מסחרי, אדריכלי ודקורטיבי']);
  specs.push(['הצעת מחיר', 'לפי מידות, גימור וכמות']);
  const others = ALL.filter(o => o.type === s.type && o.id !== s.id);

  mount(
    el('div', {class:'crumbs'}, el('a', {href:'index.html', text:'דף הבית'}), ' › ', el('a', {href:'#/', text:'קטלוג'}), ' › ' + s.name),
    el('div', {class:'hero'},
      el('div', null,
        el('h1', {text:s.name}),
        el('p', null, el('strong', {text:s.name}), ' — ' + s.text),
        el('p', {text: isOnyx
          ? 'ב-ROCCA אנחנו מספקים ' + s.name + ' בלוחות ובחלקים מיוחדים לשולחנות, ברים, קירות מוארים, פינות אוכל, גופי תאורה, כיורים ומשטחים — ומלווים עד ההתקנה והתאורה.'
          : 'ב-ROCCA אנחנו מספקים ' + s.name + ' בלוחות, אריחים וחלקים מיוחדים לרצפות, קירות, מטבחים, אמבטיות ומדרגות — ומלווים עד ההתקנה.'}),
        isOnyx ? el('p', null, el('strong', {text:'בוחרים לוח, לא דוגמה: '}), 'כל לוח אוניקס יחיד במינו. נציג לכם את הלוחות הזמינים כדי שתבחרו בדיוק את מה שיותקן.') : null),
      el('div', null,
        el('div', {class:'frame'}, zoomBtn(s.imgs[0], s.name, el('img', {src:src(s.imgs[0]), alt:s.name, fetchpriority:'high'}))),
        el('div', {class:'caption', text:s.name}))),
    el('div', {class:'box'},
      el('h2', {text:'למה לבחור ' + s.name + '?'}),
      el('p', {style:'margin:0', text: isOnyx
        ? s.name + ' מוערך בזכות היופי הטבעי, הגוונים והיכולת להאיר אותו מאחור — מה שהופך אותו לפריט פיסולי בכל חלל. הוא אחת הבחירות היוקרתיות ביותר לעיצוב פנים: שולחנות, קירות מוארים, ברים וגופי תאורה.'
        : s.name + ' הוא אבן טבעית עמידה ואלגנטית, שמתאימה לבתים פרטיים ולפרויקטים מסחריים — מרצפות וקירות ועד מטבחים ואמבטיות.'})),
    el('h2', {class:'center', text:'למה לבחור ב-ROCCA?'}),
    el('div', {class:'why'}, WHY[s.type].map(([t, d]) => el('div', null, el('b', {text:t}), el('span', {text:d})))),
    el('h2', {class:'center', text:'מפרט ' + s.name}),
    el('table', {class:'spec'}, el('tbody', null, specs.map(([k, v]) => el('tr', null, el('th', {scope:'row', text:k}), el('td', {text:v}))))),
    el('h2', {class:'center', text:'יישומים של ' + s.name}),
    el('div', {class:'apps'}, APPS[s.type].map(([t, d, f]) => el('div', null, el('b', {text:t}), el('span', {text:d}), el('span', {style:'display:block;margin-top:6px;color:var(--accent);font-weight:700', text:'פורמט מומלץ: ' + f})))),
    s.imgs.length > 1 ? [el('h2', {class:'center', text:'גלריה'}),
      el('div', {class:'gal'}, s.imgs.slice(1).map(f => zoomBtn(f, s.name, el('img', {src:src(f), alt:s.name + ' — יישום', loading:'lazy'}))))] : null,
    el('div', {class:'ctabox'},
      el('p', null, el('strong', {text:'רוצים הצעת מחיר על ' + s.name + '? '}), 'שלחו לנו את מידות הפרויקט ונחזור אליכם עם הצעה מותאמת.'),
      el('a', {class:'btn wa', target:'_blank', rel:'noopener', href:WA + encodeURIComponent(ask), text: isOnyx ? 'לראות לוחות זמינים בוואטסאפ' : 'הצעת מחיר בוואטסאפ'}),
      el('a', {class:'btn ghost', href:'tel:0528792023', text:'חייגו 052-879-2023'})),
    el('div', {class:'more'},
      el('div', {class:'group', text: isOnyx ? 'גוונים נוספים של אוניקס' : 'סוגי שיש נוספים'}),
      el('div', {class:'cards'}, others.map(card))));
}

function route(){
  const id = location.hash.replace(/^#\/?/, '');
  const s = ALL.find(x => x.id === id);
  if(s) renderStone(s); else renderCatalog();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();

const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCap = document.getElementById('lbCaption');
let cur = 0, lastFocus = null;
function showLb(i){
  cur = (i + lbItems.length) % lbItems.length;
  lbImg.src = lbItems[cur].src; lbImg.alt = lbItems[cur].caption; lbCap.textContent = lbItems[cur].caption;
}
function openLb(i){ lastFocus = document.activeElement; showLb(i); lb.classList.add('open'); document.getElementById('lbClose').focus(); }
function closeLb(){ lb.classList.remove('open'); if(lastFocus) lastFocus.focus(); }
document.getElementById('lbClose').onclick = closeLb;
document.getElementById('lbPrev').onclick = () => showLb(cur - 1);
document.getElementById('lbNext').onclick = () => showLb(cur + 1);
lb.addEventListener('click', e => { if(e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if(!lb.classList.contains('open')) return;
  if(e.key === 'Escape') closeLb();
  if(e.key === 'ArrowLeft') showLb(cur + 1);
  if(e.key === 'ArrowRight') showLb(cur - 1);
});
</script>
