# Render Blueprint — lets you deploy server/ with a few clicks instead of a terminal.
# Docs: https://render.com/docs/blueprint-spec
# Usage: push this repo to GitHub, then in Render click "New +" -> "Blueprint" and
# point it at the repo (or use the "Deploy to Render" button in server/README.md).
services:
  - type: web
    name: rocca-social-bot
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: PORT
        value: 3000
      # Auto-generated by Render — copy this value into the dashboard login screen.
      - key: DASHBOARD_TOKEN
        generateValue: true
      # Auto-generated — paste the same value into Meta's webhook setup screen.
      - key: META_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      # Everything below needs your own values — fill them in from the Render
      # dashboard (Environment tab) after the first deploy. See server/README.md
      # for where to get each one.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional override of the tier's monthly Claude-call allowance (0 = use the tier). Usage: /api/usage.
      # Subscription tier: basic | premium | vip (limits in server/src/lib/plans.ts)
      - key: PLAN_TIER
        value: vip
      # Top-up packs (payment-page URLs from the payment provider) + secret for its webhook
      - key: PACK_LINK_SMALL
        sync: false
      - key: PACK_LINK_MEDIUM
        sync: false
      - key: PACK_LINK_LARGE
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      # Postgres connection string (free Neon project) so posts, credits and usage survive restarts
      - key: DATABASE_URL
        sync: false
      # "Connect with Facebook" (Meta app credentials + this service's public URL)
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_LOGIN_CONFIG_ID
        sync: false
      - key: PUBLIC_URL
        value: https://rocca-social-bot.onrender.com
      # true on customer copies: no content is written until the business is set up in the app (Settings tab)
      - key: REQUIRE_PROFILE
        value: "false"
      # Optional second model: Gemini. Without GEMINI_API_KEY the app uses Claude only.
      - key: GEMINI_API_KEY
        sync: false
      # Which tiers use Gemini (comma list: basic,premium,vip). Empty = Claude for all. AI_PROVIDER=gemini = Gemini for all.
      - key: GEMINI_FOR_TIERS
        value: ""
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Shown in the privacy policy / terms pages (/legal/privacy, /legal/terms, /legal/data-deletion)
      - key: OPERATOR_NAME
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: AI_MONTHLY_LIMIT
        value: "0"
      # Business description / brand voice for Claude. Leave empty for ROCCA's built-in voice.
      - key: BRAND_VOICE
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_IG_USER_ID
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: X_APP_KEY
        sync: false
      - key: X_APP_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      - key: AUTO_SEND_REPLIES
        value: "false"
      - key: AUTO_GIT_PUSH
        value: "false"
      - key: WEBSITE_REPO_PATH
        value: ".."
    # Render's free plan has no persistent disk, so server/data/*.json (post &
    # reply history) resets on every redeploy/restart. Upgrade to a paid plan
    # and uncomment this to keep history across deploys:
    # disk:
    #   name: rocca-data
    #   mountPath: /opt/render/project/src/server/data
    #   sizeGB: 1
