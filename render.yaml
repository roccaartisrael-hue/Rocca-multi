# Render Blueprint — lets you deploy server/ with a few clicks instead of a terminal.
# Docs: https://render.com/docs/blueprint-spec
# Usage: push this repo to GitHub, then in Render click "New +" -> "Blueprint" and
# point it at the repo (or use the "Deploy to Render" button in server/README.md).
services:
  - type: web
    name: rocca-social-bot
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: PORT
        value: 3000
      # Auto-generated by Render — copy this value into the dashboard login screen.
      - key: DASHBOARD_TOKEN
        generateValue: true
      # Auto-generated — paste the same value into Meta's webhook setup screen.
      - key: META_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      # Everything below needs your own values — fill them in from the Render
      # dashboard (Environment tab) after the first deploy. See server/README.md
      # for where to get each one.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_IG_USER_ID
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: X_APP_KEY
        sync: false
      - key: X_APP_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      - key: AUTO_SEND_REPLIES
        value: "false"
      - key: AUTO_GIT_PUSH
        value: "false"
      - key: WEBSITE_REPO_PATH
        value: ".."
    # Render's free plan has no persistent disk, so server/data/*.json (post &
    # reply history) resets on every redeploy/restart. Upgrade to a paid plan
    # and uncomment this to keep history across deploys:
    # disk:
    #   name: rocca-data
    #   mountPath: /opt/render/project/src/server/data
    #   sizeGB: 1
