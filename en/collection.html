const WHY = {"onyx": [["Personal slab selection", "With onyx you choose the slab itself — what you see is exactly what gets installed in your space."], ["Made to measure", "Slabs, tables, bars, light fixtures and special pieces according to the project's needs."], ["Professional guidance", "We help you choose the thickness, finish and backlighting system that fit your project."], ["Tailored quote", "Pricing per slab or per project — based on dimensions, quantity, finish and type of work."]], "marble": [["Selected quality", "Slabs with uniform texture and natural veining, suited to homes and commercial projects."], ["Cut to size", "Tiles, slabs, countertops, stairs and special pieces according to the plan."], ["Professional guidance", "We help you choose the format, thickness and finish that fit the use and the style."], ["Tailored quote", "Pricing per sq m or per project — based on dimensions, quantity and finish."]]};
const APPS = {"onyx": [["🪵 Tables and dining nooks", "Dining tables, coffee tables and side tables — luxury and a stunning finish.", "Slabs, cut to size"], ["💡 Backlit walls", "Walls with LED lighting behind. Onyx's translucency creates a dramatic light effect.", "Slabs"], ["🍸 Bars and countertops", "Kitchen bars, entertaining bars and decorative surfaces with a strong presence.", "Slabs, custom-size countertops"], ["💧 Sinks and bathrooms", "Sinks, bathroom walls and showers — a touch of luxury.", "Slabs, special cuts"], ["🔦 Light fixtures", "Lamps and decorative light fixtures — warm, enveloping light.", "Custom cut"], ["🎨 Decorative elements", "Fireplaces, niches, shelves and architectural details.", "Custom size"]], "marble": [["🏠 Floors", "Flooring for living rooms, entryways and commercial spaces — durable and elegant.", "Tiles, parquet, strips"], ["🧱 Wall cladding", "Interior and exterior walls, facades and accent walls.", "Slabs, tiles"], ["🍳 Kitchens", "Worktops, islands and backsplashes.", "Custom-size countertops"], ["🛁 Bathrooms", "Walls, countertops, sinks and showers.", "Slabs, special cuts"], ["🪜 Stairs", "Steps, landings and railings.", "Cut to size"], ["🏛️ Decorative elements", "Columns, railings, window sills and special details.", "Custom size"]]};
const WA = 'https://wa.me/19093443250?text=';
const ALL = [...STONES.onyx.map(s => ({...s, type:'onyx'})), ...STONES.marble.map(s => ({...s, type:'marble'}))];
const app = document.getElementById('app');
let lbItems = [];

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs || {})){
    if(k === 'text') n.textContent = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for(const c of kids.flat(Infinity)) if(c !== null && c !== undefined && c !== false) n.append(c);
  return n;
}
const src = f => '../images/collection/' + f;
const mount = (...kids) => app.replaceChildren(...kids.flat(Infinity).filter(Boolean));

function card(s){
  return el('a', {class:'card', href:'#/' + s.id},
    el('div', {class:'ph'}, el('img', {src:src(s.imgs[0]), alt:s.name, loading:'lazy'})),
    el('div', {class:'t', text:s.name}),
    el('div', {class:'go', text:T.details}));
}

function renderCatalog(){
  document.title = T.title_cat;
  mount(
    el('div', {class:'crumbs'}, el('a', {href:'index.html', text:T.home}), ' › ' + T.cat),
    el('div', {class:'kicker', text:T.kicker}),
    el('h1', {text:T.h1}),
    el('p', {class:'lead', text:T.lead}),
    el('div', {class:'note'}, el('strong', {text:T.note_b}), T.note),
    el('div', {class:'group', text:T.g_onyx}),
    el('div', {class:'cards'}, STONES.onyx.map(card)),
    el('div', {class:'group', text:T.g_marble}),
    el('div', {class:'cards'}, STONES.marble.map(card)),
    el('div', {class:'ctabox', style:'margin-top:56px'},
      el('p', {text:T.cta_cat}),
      el('a', {class:'btn wa', target:'_blank', rel:'noopener', href:WA + encodeURIComponent(T.wa_cat_btn), text:T.wa_quote})));
  lbItems = [];
  document.getElementById('waFloat').href = WA + encodeURIComponent(T.wa_cat_float);
}

function zoomBtn(file, caption, inner){
  const idx = lbItems.length;
  lbItems.push({src:src(file), caption});
  return el('button', {type:'button', 'aria-label':T.zoom + caption, onclick:() => openLb(idx)}, inner);
}

function renderStone(s){
  const isOnyx = s.type === 'onyx';
  lbItems = [];
  document.title = s.name + ' | ROCCA';
  const ask = isOnyx ? T.ask_onyx + s.name : T.ask_marble + s.name;
  document.getElementById('waFloat').href = WA + encodeURIComponent(ask);
  const specs = [
    [T.s_name, s.name + ' (' + s.latin + ')'],
    [T.s_look, s.look],
    [T.s_forms, s.forms || ONYX_SPECS.forms],
    [T.s_finish, s.finish || ONYX_SPECS.finish],
    [T.s_thick, s.thick || ONYX_SPECS.thick],
  ];
  if(s.extra) specs.push([T.s_dur, s.extra]);
  specs.push([T.s_uses, (isOnyx ? ONYX_USES : MARBLE_USES).join(T.comma)]);
  specs.push([T.s_proj, T.s_proj_v]);
  specs.push([T.s_quote, T.s_quote_v]);
  const others = ALL.filter(o => o.type === s.type && o.id !== s.id);

  mount(
    el('div', {class:'crumbs'}, el('a', {href:'index.html', text:T.home}), ' › ', el('a', {href:'#/', text:T.cat}), ' › ' + s.name),
    el('div', {class:'hero'},
      el('div', null,
        el('h1', {text:s.name}),
        el('p', null, el('strong', {text:s.name}), ' — ' + s.text),
        el('p', {text: isOnyx
          ? T.p_onyx_pre + s.name + T.p_onyx_post
          : T.p_marble_pre + s.name + T.p_marble_post}),
        isOnyx ? el('p', null, el('strong', {text:T.choose_b}), T.choose) : null),
      el('div', null,
        el('div', {class:'frame'}, zoomBtn(s.imgs[0], s.name, el('img', {src:src(s.imgs[0]), alt:s.name, fetchpriority:'high'}))),
        el('div', {class:'caption', text:s.name}))),
    el('div', {class:'box'},
      el('h2', {text:T.why_h_pre + s.name + T.why_h_post}),
      el('p', {style:'margin:0', text: isOnyx
        ? s.name + T.box_onyx_post
        : s.name + T.box_marble_post})),
    el('h2', {class:'center', text:T.why_rocca}),
    el('div', {class:'why'}, WHY[s.type].map(([t, d]) => el('div', null, el('b', {text:t}), el('span', {text:d})))),
    el('h2', {class:'center', text:T.spec_pre + s.name + T.spec_post}),
    el('table', {class:'spec'}, el('tbody', null, specs.map(([k, v]) => el('tr', null, el('th', {scope:'row', text:k}), el('td', {text:v}))))),
    el('h2', {class:'center', text:T.apps_pre + s.name + T.apps_post}),
    el('div', {class:'apps'}, APPS[s.type].map(([t, d, f]) => el('div', null, el('b', {text:t}), el('span', {text:d}), el('span', {class:'fmt', text:T.fmt + f})))),
    s.imgs.length > 1 ? [el('h2', {class:'center', text:T.gallery}),
      el('div', {class:'gal'}, s.imgs.slice(1).map(f => zoomBtn(f, s.name, el('img', {src:src(f), alt:s.name + T.app_alt, loading:'lazy'}))))] : null,
    el('div', {class:'ctabox'},
      el('p', null, el('strong', {text:T.quote_b_pre + s.name + T.quote_b_post}), T.quote_t),
      el('a', {class:'btn wa', target:'_blank', rel:'noopener', href:WA + encodeURIComponent(ask), text: isOnyx ? T.wa_avail : T.wa_quote}),
      el('a', {class:'btn ghost', href:'tel:+972536761717', text:T.call})),
    el('div', {class:'more'},
      el('div', {class:'group', text: isOnyx ? T.more_onyx : T.more_marble}),
      el('div', {class:'cards'}, others.map(card))));
}

function route(){
  const id = location.hash.replace(/^#\/?/, '');
  const s = ALL.find(x => x.id === id);
  if(s) renderStone(s); else renderCatalog();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();

const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCap = document.getElementById('lbCaption');
let cur = 0, lastFocus = null;
function showLb(i){
  cur = (i + lbItems.length) % lbItems.length;
  lbImg.src = lbItems[cur].src; lbImg.alt = lbItems[cur].caption; lbCap.textContent = lbItems[cur].caption;
}
function openLb(i){ lastFocus = document.activeElement; showLb(i); lb.classList.add('open'); document.getElementById('lbClose').focus(); }
function closeLb(){ lb.classList.remove('open'); if(lastFocus) lastFocus.focus(); }
document.getElementById('lbClose').onclick = closeLb;
document.getElementById('lbPrev').onclick = () => showLb(cur - 1);
document.getElementById('lbNext').onclick = () => showLb(cur + 1);
lb.addEventListener('click', e => { if(e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if(!lb.classList.contains('open')) return;
  if(e.key === 'Escape') closeLb();
  if(e.key === 'ArrowLeft') showLb(cur - 1);
  if(e.key === 'ArrowRight') showLb(cur + 1);
});
</script>
